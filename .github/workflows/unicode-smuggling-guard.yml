# Fails on invisible Unicode that could hide instructions in code, prompts
# and docs read by reviewers and LLM agents.
name: Unicode smuggling guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: raulkivi/unicode-smuggling-guard@5b1ddb1fa7a53872832315f8ead14d4aeeb8af9f # v1.2.0
