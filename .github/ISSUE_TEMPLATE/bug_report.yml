name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste real chat text, API keys or tokens. Redact logs first.
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Learn
        - Analyze
        - Other / not sure
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Log provider (Analyze mode)
      options:
        - VS Code Copilot Chat
        - mitmproxy capture
        - pi coding agent
        - Claude Code
        - Not applicable
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, Node version and browser
      placeholder: "Ubuntu 24.04, Node 22.12, Firefox 130"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Server output or console errors
      description: Redact anything sensitive.
      render: text
